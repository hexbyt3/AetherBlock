name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hekate-ini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hekate_ipl.ini arming against a model of hekate's parser
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Iinclude tests/hekate_ini_test.c source/hekate_ini.c -o ini_test
          ./ini_test

  zip-stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Streaming unzip against hand-built archives
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Iinclude tests/zip_stream_test.c source/zip_stream.c -lz -o zs_test
          ./zs_test

  stream-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the downloader for the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev
          cc -std=gnu11 -Wall -Wextra -Werror -g -fsanitize=thread \
            -Itests/stubs -Iinclude -Ilib \
            tests/stream_e2e.c source/stream_fetch.c source/zip_stream.c \
            source/download.c lib/cJSON.c -lcurl -lz -lpthread -o stream_e2e

      - name: Self-update version lookup lands on a release tag
        run: |
          landed=$(./stream_e2e --resolve https://github.com/hexbyt3/AetherBlock/releases/latest)
          echo "latest resolves to: $landed"
          echo "$landed" | grep -Eq '/releases/tag/v[0-9]+\.[0-9]+\.[0-9]+$'

      - name: A download that keeps dropping resumes and finishes
        run: |
          head -c 5000000 /dev/urandom > pkg.bin
          python3 tests/flaky_server.py pkg.bin 8765 &
          sleep 1

          ./stream_e2e --get http://127.0.0.1:8765/good 5000000 got_good.bin 2> good.log
          cat good.log
          cmp pkg.bin got_good.bin
          test "$(grep -c resuming good.log)" -ge 6

          ./stream_e2e --get http://127.0.0.1:8765/stall 5000000 got_stall.bin 2> stall.log
          cat stall.log
          cmp pkg.bin got_stall.bin
          grep -q 'Timeout was reached.*resuming' stall.log

          # a server that ignores Range must never produce a stitched file
          if ./stream_e2e --get http://127.0.0.1:8765/norange 5000000 got_norange.bin; then
            echo "expected a failure"; exit 1
          fi
          test ! -e got_norange.bin

          if ./stream_e2e --get http://127.0.0.1:8765/missing 5000000 got_missing.bin; then
            echo "expected a failure"; exit 1
          fi
          test ! -e got_missing.bin

      - name: Download the newest firmware package both ways and compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r url size < <(gh api 'repos/THZoria/NX_Firmware/releases?per_page=1' \
            --jq '.[0].assets[] | select(.name | endswith(".zip")) | "\(.browser_download_url) \(.size)"' | head -1)
          echo "package: $url ($size bytes)"

          start=$(date +%s)
          ./stream_e2e "$url" "$size" streamed/
          echo "streamed in $(( $(date +%s) - start )) s"

          curl -sSL --retry 3 -o firmware.zip "$url"
          mkdir reference && unzip -q firmware.zip -d reference
          diff -r reference streamed
          echo "$(find streamed -type f | wc -l) files identical to unzip"
